    <!-- 3D Engine Operations Logic Context Setup Script -->
    <script>
        let scene, camera, renderer, cubeGroup;
        const piecesArray = [];
        
        const palette = {
            U: 0xf8fafc, // Up: White
            D: 0xeab308, // Down: Yellow
            L: 0x22c55e, // Left: Green
            R: 0xef4444, // Right: Red
            F: 0x3b82f6, // Front: Blue
            B: 0xf97316  // Back: Orange
        };

        function initCoreViewport3D() {
            const mountPoint = document.getElementById('canvas-mount-point');
            
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(40, mountPoint.clientWidth / mountPoint.clientHeight, 0.1, 100);
            camera.position.set(4.5, 4.5, 6.5);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(mountPoint.clientWidth, mountPoint.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            mountPoint.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.85));
            const spotlight = new THREE.DirectionalLight(0xffffff, 0.4);
            spotlight.position.set(8, 12, 8);
            scene.add(spotlight);

            cubeGroup = new THREE.Group();
            const geometry = new THREE.BoxGeometry(0.94, 0.94, 0.94);

            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    for (let z = -1; z <= 1; z++) {
                        const internalMaterials = [
                            new THREE.MeshBasicMaterial({ color: x === 1 ? palette.R : 0x0f172a }),
                            new THREE.MeshBasicMaterial({ color: x === -1 ? palette.L : 0x0f172a }),
                            new THREE.MeshBasicMaterial({ color: y === 1 ? palette.U : 0x0f172a }),
                            new THREE.MeshBasicMaterial({ color: y === -1 ? palette.D : 0x0f172a }),
                            new THREE.MeshBasicMaterial({ color: z === 1 ? palette.F : 0x0f172a }),
                            new THREE.MeshBasicMaterial({ color: z === -1 ? palette.B : 0x0f172a })
                        ];

                        const subMeshPiece = new THREE.Mesh(geometry, internalMaterials);
                        subMeshPiece.position.set(x, y, z);
                        cubeGroup.add(subMeshPiece);
                        piecesArray.push(subMeshPiece);
                    }
                }
            }
            scene.add(cubeGroup);
        }

        function triggerRenderFrameLoop() {
            requestAnimationFrame(triggerRenderFrameLoop);
            if(cubeGroup) {
                cubeGroup.rotation.y += 0.003;
                cubeGroup.rotation.x = 0.28;
            }
            renderer.render(scene, camera);
        }

        // Local UI Local Randomizer Component Handler Scrambler Simulation Mock
        document.getElementById('scramble-trigger').addEventListener('click', () => {
            document.getElementById('solution-stream').innerText = "CALCULATING RANDOM MATRIX SCRAMBLE CONFIGURATION...";
            piecesArray.forEach(mesh => {
                mesh.rotation.x = (Math.floor(Math.random() * 4) * Math.PI) / 2;
                mesh.rotation.y = (Math.floor(Math.random() * 4) * Math.PI) / 2;
            });
            document.getElementById('solution-stream').innerText = "CUBE PATTERN SCRAMBLED VISUALLY. INPUT DEF UPDATED.";
        });

        // Connected API Processing Logic Trigger Engine Block Call
        document.getElementById('solve-trigger').addEventListener('click', async () => {
            const patternString = document.getElementById('state-definition-input').value.trim();
            const streamDisplay = document.getElementById('solution-stream');
            const metricsBadge = document.getElementById('metrics-badge');
            const metricsCount = document.getElementById('metrics-count');

            streamDisplay.innerText = "POSTING COMPILATION PIPELINE PAYLOAD PACKETS TO SERVER...";
            
            try {
                const apiResponse = await fetch('http://127.0.0', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ definition_string: patternString })
                });

                const data = await apiResponse.json();
