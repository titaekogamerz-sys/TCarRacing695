<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Turbo Rush</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>

<body>

<!-- ================= LOBBY ================= -->

<div id="lobby">

    <div class="lobbyTop">
        <div class="gameLogo">TURBO<br><span>RUSH</span></div>

        <div class="lobbyMode">
            RACING MODE
        </div>
    </div>


    <div class="showroom">

        <div class="carLight"></div>

        <div id="showCar"></div>

        <div class="carName">
            <small>SELECT VEHICLE</small>
            <h1 id="carTitle">FALCON GT</h1>
        </div>

        <button id="prevCar" class="selectArrow">‹</button>
        <button id="nextCar" class="selectArrow">›</button>

    </div>


    <div class="raceSelect">

        <div class="sectionTitle">
            SELECT RACE
        </div>

        <div class="raceTabs">

            <button class="raceTab active" data-race="0">
                <b>CITY</b>
                <span>3 LAPS</span>
            </button>

            <button class="raceTab" data-race="1">
                <b>DESERT</b>
                <span>2 LAPS</span>
            </button>

            <button class="raceTab" data-race="2">
                <b>MOUNTAIN</b>
                <span>CHECKPOINTS</span>
            </button>

            <button class="raceTab" data-race="3">
                <b>NIGHT</b>
                <span>RAIN</span>
            </button>

        </div>

        <div class="raceInfo">

            <div>
                <small>TRACK</small>
                <strong id="trackName">
                    NEON CITY
                </strong>
            </div>

            <div>
                <small>RULE</small>
                <strong id="raceRule">
                    FIRST TO FINISH
                </strong>
            </div>

        </div>

    </div>


    <div class="bottomLobby">

        <div class="carStats">

            <div>
                <small>SPEED</small>
                <div class="statBar">
                    <i id="speedBar"></i>
                </div>
            </div>

            <div>
                <small>ACCEL</small>
                <div class="statBar">
                    <i id="accelBar"></i>
                </div>
            </div>

            <div>
                <small>HANDLING</small>
                <div class="statBar">
                    <i id="handlingBar"></i>
                </div>
            </div>

        </div>

        <button id="playButton">
            PLAY
        </button>

    </div>

</div>


<!-- ================= GAME ================= -->

<div id="game">

    <div id="gameCanvas"></div>

    <div class="hud">

        <div class="position">
            <small>POSITION</small>
            <strong id="position">
                1<sup>ST</sup>
            </strong>
        </div>

        <div class="lap">
            <small>LAP</small>
            <strong>
                <span id="lap">1</span>/<span id="maxLap">3</span>
            </strong>
        </div>

        <div class="speed">
            <strong id="speed">0</strong>
            <small>KM/H</small>
        </div>

    </div>


    <div id="countdown">
        3
    </div>


    <div class="touchControls">

        <div class="steering">

            <button id="leftBtn"> </button>
            <button id="rightBtn"> </button>

        </div>

        <div class="pedals">

            <button id="brakeBtn">
                BRAKE
            </button>

            <button id="gasBtn">
                GAS
            </button>

        </div>

    </div>


    <div id="finishScreen">

        <div class="finishBox">

            <small>RACE COMPLETE</small>

            <h1 id="finishPosition">
                1ST
            </h1>

            <p id="finishTime">
                FINISHED
            </p>

            <button id="backLobby">
                BACK TO LOBBY
            </button>

        </div>

    </div>

</div>


<script src="physics.js"></script>
<script src="track.js"></script>
<script src="ai.js"></script>
<script src="game.js"></script>
<script src="lobby.js"></script>

</body>
  </html>
